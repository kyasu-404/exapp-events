[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exapp-events"
version = "0.1.1"
description = "Nextcloud ExApp: XLSX to Calendar and SMTP reminders"
requires-python = ">=3.12"
dependencies = [
  "nc_py_api[app]==0.30.3", "fastapi==0.142.2", "uvicorn==0.54.0",
  "openpyxl==3.1.5", "icalendar==7.3.0", "email-validator==2.3.0",
  "tzdata==2026.5", "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["ex_app*"]

[tool.setuptools.package-data]
"ex_app.lib.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
